<svg xmlns="http://www.w3.org/2000/svg" width="480" height="558" viewBox="0 0 480 558" role="img" aria-labelledby="title desc" xml:lang="zh-TW">
  <title id="title">ExeBlueprint — 輸入、分析、查看結果</title>
  <desc id="desc">EXE、DLL、資料夾、ZIP 或 ASAR 經過靜態分析，輸出 REPORT.md 與 blueprint.json，不執行輸入程式。</desc>
  <rect width="480" height="558" rx="16" fill="#f3f6fc"/>
  <g font-family="Segoe UI, Microsoft JhengHei, PingFang TC, Noto Sans CJK TC, sans-serif">
    <text x="24" y="37" font-size="24" font-weight="700" fill="#20355b">輸入、分析、查看結果</text>
    <rect x="24" y="64" width="432" height="128" rx="12" fill="#fff" stroke="#cbd7e9"/>
    <rect x="24" y="218" width="432" height="128" rx="12" fill="#fff" stroke="#cbd7e9"/>
    <rect x="24" y="372" width="432" height="144" rx="12" fill="#172c4e"/>
    <g fill="none" stroke="#7189aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M240 198v14m-5-5 5 5 5-5"/>
      <path d="M240 352v14m-5-5 5 5 5-5"/>
    </g>
    <text x="44" y="96" font-size="20" font-weight="700" fill="#2563eb">01 / 選擇來源</text>
    <text x="44" y="136" font-size="32" font-weight="600" fill="#172c4e">EXE / DLL</text>
    <text x="44" y="171" font-size="23" fill="#52627b">資料夾 · ZIP · ASAR</text>
    <text x="44" y="250" font-size="20" font-weight="700" fill="#2563eb">02 / 靜態分析</text>
    <text x="44" y="290" font-size="28" fill="#172c4e">檔案與相依關係</text>
    <text x="44" y="325" font-size="24" fill="#52627b">程式結構與資源</text>
    <text x="44" y="406" font-size="20" font-weight="700" fill="#a9c9ff">03 / 查看結果</text>
    <text x="44" y="448" font-family="Consolas, monospace" font-size="32" fill="#fff">REPORT.md</text>
    <text x="44" y="490" font-family="Consolas, monospace" font-size="32" fill="#b6d2ff">blueprint.json</text>
    <text x="24" y="544" font-size="18" fill="#52627b">ExeBlueprint · 可選擇匯出程式骨架</text>
  </g>
</svg>
