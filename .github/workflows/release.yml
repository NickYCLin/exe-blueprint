name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Tag 格式錯誤：$env:RELEASE_TAG"
          }

          [xml] $props = Get-Content .\Directory.Build.props -Raw
          $projectVersion = [string] $props.Project.PropertyGroup.Version
          if ($projectVersion -ne $Matches.version) {
              throw "Tag 版本 $($Matches.version) 與專案版本 $projectVersion 不一致。"
          }

          $notesPath = ".\docs\releases\$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
              throw "找不到版本說明：$notesPath"
          }

      - name: Restore
        run: dotnet restore .\ExeBlueprint.slnx

      - name: Build
        run: dotnet build .\ExeBlueprint.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\ExeBlueprint.slnx -c Release --no-build

  package:
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset_suffix: win-x64
          - os: ubuntu-latest
            rid: linux-x64
            asset_suffix: linux-x64
          - os: macos-15-intel
            rid: osx-x64
            asset_suffix: macos-x64
          - os: macos-15
            rid: osx-arm64
            asset_suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $desktopDir = Join-Path $env:RUNNER_TEMP "desktop-$env:TARGET_RID"
          $cliDir = Join-Path $env:RUNNER_TEMP "cli-$env:TARGET_RID"

          dotnet publish ./src/ExeBlueprint.Desktop `
              -c Release `
              -r $env:TARGET_RID `
              --self-contained true `
              -p:Version=$version `
              -p:PublishSingleFile=false `
              -p:DebugSymbols=false `
              -p:DebugType=None `
              -o $desktopDir

          dotnet publish ./src/ExeBlueprint.Cli `
              -c Release `
              -r $env:TARGET_RID `
              --self-contained true `
              -p:Version=$version `
              -p:PublishSingleFile=true `
              -p:DebugSymbols=false `
              -p:DebugType=None `
              -o $cliDir

      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_RID: ${{ matrix.rid }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP "stage-$env:TARGET_RID"
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $stageDir, $assetDir -Force | Out-Null

          Copy-Item -Path (Join-Path $env:RUNNER_TEMP "desktop-$env:TARGET_RID\*") -Destination $stageDir -Recurse
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "cli-$env:TARGET_RID\exe-blueprint.exe") `
              -Destination (Join-Path $stageDir 'exe-blueprint-cli.exe')
          Copy-Item -LiteralPath .\packaging\README-desktop.txt -Destination (Join-Path $stageDir 'README.txt')

          $assetPath = Join-Path $assetDir "ExeBlueprint-$env:RELEASE_TAG-$env:ASSET_SUFFIX.zip"
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $assetPath -CompressionLevel Optimal

          & (Join-Path $stageDir 'exe-blueprint-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI smoke test 失敗。' }

      - name: Package Linux
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_RID: ${{ matrix.rid }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          stage_dir="$RUNNER_TEMP/stage-$TARGET_RID"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$stage_dir" "$asset_dir"
          cp -R "$RUNNER_TEMP/desktop-$TARGET_RID/." "$stage_dir/"
          cp "$RUNNER_TEMP/cli-$TARGET_RID/exe-blueprint" "$stage_dir/exe-blueprint-cli"
          cp ./packaging/README-desktop.txt "$stage_dir/README.txt"
          chmod +x "$stage_dir/ExeBlueprint" "$stage_dir/exe-blueprint-cli"

          "$stage_dir/exe-blueprint-cli" --version
          tar -C "$stage_dir" -czf "$asset_dir/ExeBlueprint-$RELEASE_TAG-$ASSET_SUFFIX.tar.gz" .

      - name: Package macOS
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_RID: ${{ matrix.rid }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          stage_dir="$RUNNER_TEMP/stage-$TARGET_RID"
          asset_dir="$RUNNER_TEMP/release-assets"
          app_dir="$stage_dir/ExeBlueprint.app"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources" "$asset_dir"
          cp -R "$RUNNER_TEMP/desktop-$TARGET_RID/." "$app_dir/Contents/MacOS/"
          cp "$RUNNER_TEMP/cli-$TARGET_RID/exe-blueprint" "$stage_dir/exe-blueprint-cli"
          cp ./packaging/README-desktop.txt "$stage_dir/README.txt"
          sed "s/__VERSION__/$version/g" ./packaging/macos/Info.plist > "$app_dir/Contents/Info.plist"
          chmod +x "$app_dir/Contents/MacOS/ExeBlueprint" "$stage_dir/exe-blueprint-cli"

          "$stage_dir/exe-blueprint-cli" --version
          (cd "$stage_dir" && zip -qry "$asset_dir/ExeBlueprint-$RELEASE_TAG-$ASSET_SUFFIX.zip" .)

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Create checksums
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $checksumLines = Get-ChildItem -LiteralPath $assetDir -File |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              }
          [System.IO.File]::WriteAllLines(
              (Join-Path $assetDir 'SHA256SUMS.txt'),
              $checksumLines,
              [System.Text.Encoding]::ASCII)

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notesPath = ".\docs\releases\$env:RELEASE_TAG.md"
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $assets = Get-ChildItem -LiteralPath $assetDir -File |
              Sort-Object Name |
              Select-Object -ExpandProperty FullName

          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
              gh release upload $env:RELEASE_TAG @assets --clobber
              gh release edit $env:RELEASE_TAG `
                  --title "ExeBlueprint $env:RELEASE_TAG" `
                  --notes-file $notesPath
          }
          else {
              gh release create $env:RELEASE_TAG @assets `
                  --verify-tag `
                  --title "ExeBlueprint $env:RELEASE_TAG" `
                  --notes-file $notesPath
          }
