name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ExeBlueprint.slnx

      - name: Build
        run: dotnet build .\ExeBlueprint.slnx -c Release --no-restore

      - name: Test
        run: dotnet test .\ExeBlueprint.slnx -c Release --no-build
