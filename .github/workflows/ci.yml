name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./ExeBlueprint.slnx

      - name: Build
        run: dotnet build ./ExeBlueprint.slnx -c Release --no-restore

      - name: Test
        env:
          EXEBLUEPRINT_UI_SCREENSHOTS: ${{ runner.temp }}/desktop-ui
        run: dotnet test ./ExeBlueprint.slnx -c Release --no-build

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-ui/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Test Ghidra exporter
        run: python -B -m unittest discover -s tests/ghidra -v
